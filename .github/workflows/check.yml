name: Check DirTree
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check && npm run build && npm test
      - run: npm run test:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:workbench
      - run: npm run package
      - run: xvfb-run -a npm run test:installed
      - uses: actions/upload-artifact@v4
        with:
          name: dirtree-vsix
          path: dirtree.vsix
          if-no-files-found: error
  compatibility:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        vscode: ['1.96.0', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dirtree-vsix
      - run: xvfb-run -a npm run test:installed
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
